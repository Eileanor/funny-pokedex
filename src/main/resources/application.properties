spring.application.name=funny-pokedex
server.port=${SERVER_PORT:5000}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
logging.level.root=${LOG_LEVEL:INFO}

# Upstream base URLs — override per environment
app.pokeapi.base-url=${POKEAPI_BASE_URL:https://pokeapi.co/api/v2}
app.funtranslations.base-url=${FUNTRANSLATIONS_BASE_URL:https://api.funtranslations.mercxry.me/v1/translate}
app.funtranslations.shakespeare-path=${FUNTRANSLATIONS_SHAKESPEARE_PATH:/shakespeare}
app.funtranslations.yoda-path=${FUNTRANSLATIONS_YODA_PATH:/yoda}

# Cache TTL — Spring Duration format, e.g. 24h, 30m, PT1H and cache names
app.cache.ttl=${CACHE_TTL:24h}
app.cache.name.pokemon=${CACHE_NAME_POKEMON:pokemon}
app.cache.name.pokemon-translated=${CACHE_NAME_POKEMON_TRANSLATED:pokemon-translated}

# Inbound rate limiter (Resilience4j @RateLimiter "inbound")
resilience4j.ratelimiter.instances.inbound.limitForPeriod=${RATE_LIMIT_FOR_PERIOD:20}
resilience4j.ratelimiter.instances.inbound.limitRefreshPeriod=${RATE_LIMIT_REFRESH_PERIOD:1m}
resilience4j.ratelimiter.instances.inbound.timeoutDuration=${RATE_LIMIT_TIMEOUT:0}
resilience4j.ratelimiter.instances.inbound.registerHealthIndicator=true

# Resilience4j — PokeAPI outbound client
# Do NOT retry on 404 — retrying immediately burns more upstream quota.
resilience4j.retry.instances.pokeApi.maxAttempts=${POKEAPI_RETRY_MAX_ATTEMPTS:3}
resilience4j.retry.instances.pokeApi.waitDuration=${POKEAPI_RETRY_WAIT:500ms}
resilience4j.retry.instances.pokeApi.ignoreExceptions[0]=com.eileanor.funny_pokedex.error.PokemonNotFoundException
resilience4j.circuitbreaker.instances.pokeApi.slidingWindowSize=${POKEAPI_CB_SLIDING_WINDOW_SIZE:10}
resilience4j.circuitbreaker.instances.pokeApi.failureRateThreshold=${POKEAPI_CB_FAILURE_RATE_THRESHOLD:50}
resilience4j.circuitbreaker.instances.pokeApi.waitDurationInOpenState=${POKEAPI_CB_WAIT_OPEN:30s}
resilience4j.circuitbreaker.instances.pokeApi.registerHealthIndicator=true

# Resilience4j — FunTranslations outbound client
# Do NOT retry on 429 — retrying immediately burns more upstream quota.
resilience4j.retry.instances.funTranslations.maxAttempts=${FUNTRANSLATIONS_RETRY_MAX_ATTEMPTS:3}
resilience4j.retry.instances.funTranslations.waitDuration=${FUNTRANSLATIONS_RETRY_WAIT:500ms}
resilience4j.retry.instances.funTranslations.ignoreExceptions[0]=org.springframework.web.reactive.function.client.WebClientResponseException$TooManyRequests
resilience4j.circuitbreaker.instances.funTranslations.slidingWindowSize=${FUNTRANSLATIONS_CB_SLIDING_WINDOW_SIZE:10}
resilience4j.circuitbreaker.instances.funTranslations.failureRateThreshold=${FUNTRANSLATIONS_CB_FAILURE_RATE_THRESHOLD:50}
resilience4j.circuitbreaker.instances.funTranslations.waitDurationInOpenState=${FUNTRANSLATIONS_CB_WAIT_OPEN:60s}
resilience4j.circuitbreaker.instances.funTranslations.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.funTranslations.ignoreExceptions[0]=org.springframework.web.reactive.function.client.WebClientResponseException$TooManyRequests

# Actuator — expose health and readiness for orchestrator probes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=${MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED:true}
