services:
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:${REDIS_PORT:-6379}"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  funny-pokedex:
    build: .
    ports:
      - "${SERVER_PORT:-5000}:${SERVER_PORT:-5000}"
    env_file:
      - .env.example
      - path: .env
        required: true
    depends_on:
      redis:
        condition: service_healthy
